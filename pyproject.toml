[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noopunk-rules"
version = "0.1.0"
description = "NoöPunk engine-neutral RPG rules, console, and portable interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See LICENSE" }
dependencies = []

[project.optional-dependencies]
test = []
web = ["nicegui>=2"]
textual = ["textual>=1"]

[project.scripts]
noopunk-case = "console.play:main"
noopunk-slice = "portable_noopunk.console:main"

[tool.setuptools]
package-dir = {"" = "src", "portable_noopunk" = "portable_noopunk"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "portable_noopunk", "portable_noopunk.*",
  "rules", "rules.*",
  "simulation", "simulation.*",
  "text_game", "text_game.*",
  "console", "console.*",
  "world", "world.*",
  "concordia_runtime", "concordia_runtime.*",
  "eclipse_phase_homebrew", "eclipse_phase_homebrew.*",
  "contracts", "contracts.*",
]
