[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noopunk-portable-slice"
version = "0.1.0"
description = "NoöPunk headless tabletop-parity prototype (not comprehensive CWN rules)"
requires-python = ">=3.10"

[tool.setuptools]


[project.optional-dependencies]
web = ["nicegui>=2"]
textual = ["textual>=1"]

[tool.setuptools.packages.find]
include = ["portable_noopunk*"]

[project.scripts]
noopunk-slice = "portable_noopunk.console:main"
