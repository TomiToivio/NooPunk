# Canonical organization data for issue #144.
# Human-readable source of truth: RULEBOOK.md.
UNSA:
  canonical_name: United Nations Security Administration
  former_names:
    - UN X-Risk Administration
  early_informal_names:
    - UN NHI Agency
  aliases:
    - X-Files
    - X-Com
    - XCOM
    - Men in Black
  rejected_aliases:
    MJ-12: "UNSA regards MJ-12 as a failed/traitorous legacy program, not a nickname."
  parent:
    - United Nations
  not_a_world_government: "UNSA is an agency, not a sovereign; member states retain sovereignty and most resources."
  origins:
    founding_mode: pooled member-state secondment
    academy: "UNSA Academy: training, continuing education and NHI/PSI/AI research centre."
  player_role:
    default: newly graduated UNSA agent on first assignment
    veteran_seconded_agents: instructors, commanders, handlers, mentors (NPCs), not forbidden as PCs
    multi_faction_membership: true
  default_campaign:
    location: Helsinki
    institutional_chain:
      - Suojelupoliisi
      - Europol
      - UNSA
    scope_rule: "Only add factions that are relevant to Helsinki-area play or a live scenario."
  functions:
    - Law Enforcement
    - Intelligence
    - Counterintelligence
    - Military Coordination
    - Scientific Research
    - Diplomacy
    - Civil Defence
    - Development
    - Humanitarian Response
    - Disaster Relief
    - Reconstruction
  mandate:
    - X-Risk
    - NHI
    - AGI/ASI
    - PSI
    - Noospace threats
    - planetary defence
    - catastrophic biotechnology
    - anomalous technology
  unofficial_network:
    - supportive governments and political leaders
    - embedded law-enforcement and intelligence assets
    - military and special-operations personnel
    - scientists and research institutions
    - cyber and technical specialists
    - psionic assets and psychotronics programs
    - private-sector and civil-society partners
    - informants and deniable intermediaries
  political_role:
    federalization_engine: true
    direction: Federal government of Earth
  disclosure_dynamics:
    both_outcomes_canonical: true
    fragmentation:
      - ontological shock
      - loss of state authority
      - survivalist chaos
      - alien-worshipping cults
      - xenophobic and doomer movements
      - hybrid infiltration
      - PSI-enabled manipulation
    unification:
      - global security integration
      - pooled sovereignty
      - world government

PROJECT_PLATO_EISS:
  canonical_name: European Information Security System
  abbreviation: EISS
  former_names:
    - Project Plato
  early_informal_names:
    - Plato
  aliases:
    - EISS
    - Plato
  rejected_aliases:
    Panopticon: >-
      Rejected as an official name AND as an interchangeable one. "Panopticon" (capitalised) is an existing
      canonical entity in rulebook/10_SINGULARITY_CRISIS.md §9.4.2 — a corporate ASI damaged into controllability —
      with its own legal position. Critics may call EISS "a panopticon" (lower case, in quotes) as a comparison;
      that is commentary, not a name, and the two must never be written as the same system.
    AEGIS: >-
      Not an alias. AEGIS was floated as a designation for the firewall subsystem and is not canon until the author
      confirms it.
  parent:
    - European Union
  operator: Europol
  function:
    - network and information security
    - the continental perimeter ("the Great Firewall")
    - defence and investigative surveillance support
    - psychotronic infrastructure for societal stability
  nature: >-
    Not an ASI. A layered federation of legacy systems, hand-written GOFAI, rule engines, limited modern AI, quantum
    machines, psychotronic subsystems and very many human operators, under statute, audit and parliamentary
    oversight.
  source: docs/world/EU_NETWORKS_AND_PLATO_1200.md
