# Pytest configuration for the NoöPunk repository.
#
# The project is tested with `unittest discover` in CI (see
# `.github/workflows/python-scaffold.yml`), which takes an explicit start directory and is
# therefore unaffected by anything here. This file exists for the *other* way of running the
# tests — a bare `pytest` from the repository root — and its one job is to keep that from
# collecting material it must not collect.
#
# Why `archive` and `legacy` are excluded:
#
#   Both hold preserved prior corpora, each of which is a self-contained project with its own
#   `src/` package and its own `tests/`. The *Ubiquitous Maniacs* corpus
#   (legacy/ubiquitous_maniacs) ships a `src/` whose package name is `src`, which shadows this
#   repository's own `src/` package when pytest inserts the corpus directory on `sys.path` via
#   rootdir-relative conftest collection. The result is `ModuleNotFoundError: No module named
#   'src.rules'` in this repository's own tests.
#
#   The corpus's `tests/` also collide with this repository's by *basename*: pytest imports a
#   test module under its bare basename, so `tests/test_character_cards.py` in this repository
#   and `strategy_game/tests/test_character_cards.py` cannot both be collected in one run — and
#   the corpus's `test_location_model.py` and friends collide the same way. That produced
#   "import file mismatch" errors across this repository's own suite.
#
#   Those corpus tests are *not* this repository's tests: they exercise the corpus's own code,
#   they were written against a different data layout (the corpus's `data/lab_people.csv` and
#   `data/lab_relationships.csv` were never committed upstream), and they are preserved as
#   reference material rather than as a maintained suite. They are excluded from collection, not
#   deleted, and not silently broken: the corpus's MANIFEST.md records every file with its hash.
#
# `norecursedirs` is a list of glob patterns matched against the directory path. The
# pytest default already skips `.*` (dotted directories) and `build`/`dist`; the entries
# below are added to that default.
#
# This file is INI syntax, which is what pytest reads from a `pytest.ini`. It is not
# `pyproject.toml` syntax.
[pytest]
# `mud/` is a separate game with its own dependency environment and its own command
# (`cd mud && python -m pytest tests`). Running it from here would import a package that
# is not on this interpreter's path, which is a boundary the ADR (#946) exists to keep.
norecursedirs =
    *.egg
    mud
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    archive
    legacy

# Issue-level fix (2026-10-25): the two test roots hold same-named modules
# (`tests/test_character_cards.py` and `strategy_game/tests/test_character_cards.py`).
# pytest's default "prepend" import mode imports each module under its bare basename, so the
# second one is reported as an import-file-mismatch and collection aborts — 2,466 tests are
# collected and then interrupted by that single error. Neither directory is a package, and
# adding `__init__.py` would change how `unittest discover -s tests` resolves, which is what CI
# runs. importlib mode keys modules by their full path instead, so both can be collected and
# CI's invocation is untouched.
addopts = --import-mode=importlib
