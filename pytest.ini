# Pytest configuration for the NoöPunk repository.
#
# The project is tested with `unittest discover` in CI (see
# `.github/workflows/python-scaffold.yml`), which takes an explicit start directory and is
# therefore unaffected by anything here. This file exists for the *other* way of running the
# tests — a bare `pytest` from the repository root — and its one job is to keep that from
# collecting material it must not collect.
#
# Why `archive` is excluded:
#
#   `archive/` holds preserved prior corpora, each of which is a self-contained project
#   with its own `src/` package and its own `tests/`. The *Ubiquitous Maniacs* archive
#   (archive/ubiquitous-maniacs-2026-10) ships a `src/` whose package name is `src`,
#   which shadows this repository's own `src/` package when pytest inserts the archive
#   directory on `sys.path` via rootdir-relative conftest collection. The result is
#   `ModuleNotFoundError: No module named 'src.rules'` in this repository's own tests.
#
#   Those archived tests are *not* this repository's tests: they exercise the archived
#   corpus's own code, they were written against a different data layout (the corpus's
#   `data/lab_people.csv` and `data/lab_relationships.csv` were never committed upstream),
#   and they are preserved as reference material rather than as a maintained suite. They
#   are excluded from collection, not deleted, and not silently broken: the archive's
#   MANIFEST.md records every file with its hash.
#
# `norecursedirs` is a list of glob patterns matched against the directory path. The
# pytest default already skips `.*` (dotted directories) and `build`/`dist`; the entries
# below are added to that default.
#
# This file is INI syntax, which is what pytest reads from a `pytest.ini`. It is not
# `pyproject.toml` syntax.
[pytest]
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    archive
