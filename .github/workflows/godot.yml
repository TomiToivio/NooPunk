name: Godot slice

on:
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "src/godot/**"
      - "data/scenarios/**"
      - "data/rules/**"
      - "tests/godot/**"
      - "tools/run_godot_tests.gd"
      - "tools/godot_smoke.sh"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

jobs:
  headless:
    name: Headless import, gameplay tests and ward smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.5.1
        run: |
          curl --fail -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --version

      - name: Import, test and smoke
        env:
          GODOT: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
        run: bash tools/godot_smoke.sh
