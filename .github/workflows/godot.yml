name: Godot verification (legacy ward + detective slice)

on:
  push:
    paths:
      - "godot/**"
      - "project.godot"
      - "scenes/**"
      - "src/godot/**"
      - "data/scenarios/**"
      - "data/rules/**"
      - "tests/godot/**"
      - "tools/**"
      - ".github/workflows/godot.yml"
  pull_request:
    paths:
      - "godot/**"
      - "project.godot"
      - "scenes/**"
      - "src/godot/**"
      - "data/scenarios/**"
      - "data/rules/**"
      - "tests/godot/**"
      - "tools/run_godot_tests.gd"
      - "tools/godot_smoke.sh"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Headless import, gameplay tests and ward smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl --fail -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import, test and smoke
        env:
          GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
        run: bash tools/godot_smoke.sh

  slice:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          curl -sSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p "$RUNNER_TEMP/godot-bin"
          # The checkout already has a `godot/` directory; putting the binary there makes the next
          # command try to execute a folder.
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot-bin/godot" --version

      - name: Import the project (headless)
        run: godot --headless --path . --import

      - name: Rules, state, dialogue and scenario-data suites
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://godot/tests/run_tests.gd 2>&1 | tee /tmp/noopunk-slice.log

          # Expected negative cases are logged by the product code as warnings carrying "(refused)",
          # so every `ERROR:` line below is unexpected by construction and needs no allowlist (#883).
          # These three must actually be present: if a refusal silently stops being logged, the
          # distinction has rotted and this step should notice rather than pass quietly.
          for expected in \
            'NoopunkSceneFlow: unusable save data (refused)' \
            'DialogueRunner: no choice 99' \
            'InvestigationAdapter: no scene no_such_scene (refused)'
          do
            if ! grep -qF "WARNING: $expected" /tmp/noopunk-slice.log; then
              echo "Expected negative-case diagnostic missing: $expected" >&2
              exit 1
            fi
          done

          grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/noopunk-slice.log \
            > /tmp/noopunk-unexpected.log || true
          if [ -s /tmp/noopunk-unexpected.log ]; then
            echo 'Unexpected Godot diagnostics:' >&2
            cat /tmp/noopunk-unexpected.log >&2
            exit 1
          fi
          # Leak bookkeeping is checked against a pinned baseline rather than by presence (#883).
          # Godot reports anonymous GDScript class objects at exit in --script mode: 0-2 per isolated
          # suite, accumulating across a single process that runs all of them, and not released by
          # dropping suite references or freeing scene nodes. Failing on any leak line would mean
          # deleting the suites; failing on growth catches real new leakage.
          python3 tools/check_godot_shutdown.py

      - name: Headless playthrough of the assembled level
        run: godot --headless --path . res://godot/tests/playthrough.tscn --quit-after 300

      - name: Scene integration playthrough (movement, props, dialogue, endings)
        run: godot --headless --path . --script res://godot/tests/integration_playthrough.gd
