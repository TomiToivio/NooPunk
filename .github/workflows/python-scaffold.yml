name: Python scaffold checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Godot scaffold
        run: python tests/validate_scaffold.py
      - name: Test Concordia runtime scaffold
        run: python -m unittest tests/test_concordia_runtime.py
      - name: Smoke-check neutral Concordia session
        run: python scripts/concordia_smoke.py
