name: Python scaffold checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the archive tag is present. #265's guarantee is that the old rulebook
      # corpus is retrievable from `rulebook-pre-narrative-2026-10`; with a shallow, tag-less
      # checkout the retrievability guards SKIP and CI verifies nothing about the archive.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Godot scaffold
        run: python tests/validate_scaffold.py
      - name: Check design-principles invariants
        run: python -m unittest discover -s tests -p "test_design_principles.py"
      # test_world_ideology.py defines module-level test functions rather than
      # TestCase classes, so `unittest discover` does NOT collect it (the pattern
      # matches the file, but there are no TestCases inside to run). It carries
      # its own runner. Without this step the whole data/world/ideology.json
      # artifact is unguarded in CI -- the checks existed but never executed.
      - name: Check world ideology model
        run: python tests/test_world_ideology.py
      - name: Test shared rules and Concordia runtime
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Smoke-check documented game commands
        run: |
          python scripts/noopunk_text.py --help
          printf 'quit\n' | python scripts/noopunk_text.py --scenario issue74
          python scripts/concordia_smoke.py
          python scripts/concordia_smoke.py --build-concordia-config
