name: Python game-code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test executable game code
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Smoke-check executable game commands
        run: |
          python scripts/noopunk_text.py --help
          printf 'quit\\n' | python scripts/noopunk_text.py --scenario issue74
          python scripts/concordia_smoke.py
          python scripts/concordia_smoke.py --build-concordia-config
