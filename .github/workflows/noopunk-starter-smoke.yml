name: NoöPunk restart smoke
on:
  push:
    paths: ["noopunk/**", ".github/workflows/restart-smoke.yml"]
  pull_request:
    paths: ["noopunk/**", ".github/workflows/restart-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl --fail -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and run the starter's smoke test
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          $GODOT --headless --path noopunk/game --import
          $GODOT --headless --path noopunk/game --script res://tests/smoke.gd
